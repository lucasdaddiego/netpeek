version: 2
updates:
  # Rust dependencies. Grouped so a refresh is one PR, not one-per-crate — the
  # tree is small but ratatui pulls a fair transitive set.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      cargo:
        patterns:
          - "*"
    # ratatui-core 0.1.2 needs lru ^0.18; remove when it allows 0.19.
    ignore:
      - dependency-name: "lru"
        versions: [">=0.19"]

  # The workflow actions themselves (checkout, rust-cache, install-action, …),
  # pinned by commit SHA in the workflows — this is what moves the SHAs.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
