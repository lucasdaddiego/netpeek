name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-coverage:
    name: build · clippy · test · coverage
    # macOS is the real platform — the kernel control socket is macOS-only, and
    # the crate doesn't build on Linux (libproc / Darwin libc). The unit tests
    # are hermetic (no socket, no network, no root), so they run fine in CI.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every action is pinned to a commit SHA (Dependabot moves them). The
      # toolchain / tool selection that the @rev used to carry is an input now.
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov

      - name: Format
        run: cargo fmt --check

      # --locked: fail if Cargo.lock is stale (e.g. a Dependabot bump that wasn't
      # regenerated), so CI builds exactly the pinned, audited dependency set.
      - name: Clippy (warnings = errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build (release)
        run: cargo build --release --locked

      - name: Tests
        run: cargo test --locked

      # The pure modules (wire protocol, model, app state, formatting, services)
      # carry the gate; the syscall / TUI / entrypoint plumbing is excluded.
      - name: Coverage gate (pure core ≥ 99% lines)
        run: >
          cargo llvm-cov
          --ignore-filename-regex 'src/(ui|dns|main)\.rs|src/ntstat/(sys|mod)\.rs'
          --summary-only --fail-under-lines 99
