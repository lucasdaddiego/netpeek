name: audit

# RUSTSEC advisory scan over the dependency tree. Runs when the manifest or
# lockfile changes, and weekly so a freshly-disclosed advisory against an
# already-pinned dependency still gets caught.
on:
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
  schedule:
    - cron: "27 4 * * 1" # Mondays 04:27 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: cargo audit (RUSTSEC)
    # cargo-audit only parses Cargo.lock against the advisory DB — it doesn't
    # build the crate — so this runs on Linux even though netpeek is macOS-only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit
