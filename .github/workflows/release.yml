name: release

# Tag-driven: pushing `vX.Y.Z` builds a universal (arm64 + x86_64) release
# binary with --locked, zips it next to a SHA256SUMS file and publishes a
# GitHub release. `workflow_dispatch` runs the same build as a dry run and
# only uploads the artifacts to the run, so the pipeline can be exercised
# (and a change to it reviewed) without cutting a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build · universal binary · zip · checksum
    runs-on: macos-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Version (a tag must match Cargo.toml)
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$EVENT" = "push" ] && [ "v$version" != "$REF_NAME" ]; then
            echo "tag $REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # --locked: the release is built from exactly the audited Cargo.lock.
      - name: Build (release, --locked, both architectures)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      # lipo keeps each slice; the ad-hoc re-sign covers the combined file
      # (Apple Silicon refuses to run native code with no signature at all).
      - name: Universal binary + smoke test
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist
          lipo -create -output dist/netpeek \
            target/aarch64-apple-darwin/release/netpeek \
            target/x86_64-apple-darwin/release/netpeek
          codesign --force --sign - dist/netpeek
          lipo -info dist/netpeek
          test "$(dist/netpeek --version)" = "netpeek $VERSION"
          dist/netpeek --help >/dev/null

      - name: Package + SHA-256
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cp LICENSE README.md dist/
          cd dist
          zip -X "netpeek-$VERSION-macos-universal.zip" netpeek LICENSE README.md
          shasum -a 256 "netpeek-$VERSION-macos-universal.zip" > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: netpeek-${{ steps.meta.outputs.version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: GitHub release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # the only job that writes anything
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: netpeek-${{ needs.build.outputs.version }}
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$REPO" --title "netpeek $TAG" \
            --generate-notes --verify-tag dist/*.zip dist/SHA256SUMS
