[package]
name = "netpeek"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Live per-process network bandwidth TUI for macOS — real pid-attributed rates and flows from the same private kernel interface nettop uses, no sudo, no packet capture."
repository = "https://github.com/lucasdaddiego/netpeek"
readme = "README.md"
keywords = ["bandwidth", "network", "tui", "macos", "nettop"]
categories = ["command-line-utilities", "network-programming", "os::macos-apis", "visualization"]

[[bin]]
name = "netpeek"
path = "src/main.rs"

[dependencies]
# TUI + terminal. crossterm is re-exported by ratatui (ratatui::crossterm), so we
# never pin it separately — there's only ever one crossterm in the tree.
# Default features pull in the calendar widget (and the `time` crate), the
# layout cache and the declarative macros, none of which netpeek uses.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# Raw socket / ioctl / getnameinfo syscalls.
libc = "0.2"
# Safe, checked casting of the kernel's #[repr(C)] wire structs to/from bytes.
bytemuck = { version = "1", features = ["derive"] }
# Bounded reverse-DNS cache (already in the tree via ratatui).
lru = "0.18"
# SIGTERM/SIGHUP/SIGINT → flag, so the TUI restores the terminal on `kill`
# (already in the tree via crossterm; only the `flag` module is used).
signal-hook = { version = "0.3", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
